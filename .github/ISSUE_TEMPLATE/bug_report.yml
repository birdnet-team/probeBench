name: Bug report
description: Something in probeBench behaves incorrectly or crashes.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A failed or truncated dataset download is usually the host (Zenodo, figshare,
        Hugging Face), not probeBench: rerun the command, downloads resume.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: The command you ran, the actual and the expected behavior, and the full traceback.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: "Output of `probebench --version`, `python --version`, and `pip show birdnet` if a BirdNET model is involved."
    validations:
      required: true
